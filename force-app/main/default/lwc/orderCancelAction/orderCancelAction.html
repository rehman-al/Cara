<template>
    <lightning-card title="Cancel Order & Refund" icon-name="standard:orders">
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <template if:false={showConfirm}>
                <p class="slds-m-bottom_small slds-text-color_weak">
                    Cancels the Order in SFCC and, if applicable, voids the authorization or refunds the
                    captured payment. On success the Order's status is set to Cancelled.
                </p>
                <lightning-button
                    variant="destructive"
                    label="Cancel Order & Refund"
                    onclick={handleShowConfirm}
                    disabled={isProcessing}
                ></lightning-button>
            </template>
            <template if:true={showConfirm}>
                <p class="slds-m-bottom_small">
                    <strong>Are you sure?</strong> This cancels the Order and processes any required
                    refund/void. This cannot be undone.
                </p>
                <lightning-button
                    variant="neutral"
                    label="Never mind"
                    onclick={handleCloseConfirm}
                    disabled={isProcessing}
                    class="slds-m-right_small"
                ></lightning-button>
                <lightning-button
                    variant="destructive"
                    label="Yes, Cancel & Refund"
                    onclick={handleCancel}
                    disabled={isProcessing}
                ></lightning-button>
            </template>
        </div>
    </lightning-card>
</template>
