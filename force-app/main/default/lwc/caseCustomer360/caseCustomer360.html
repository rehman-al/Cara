<template>
    <div class="customer-shell">

        <!-- HEADER -->
        <div class="customer-header">
            <div class="customer-header-left">
                <div class="customer-icon">
                    <lightning-icon
                        icon-name="standard:account"
                        size="small">
                    </lightning-icon>
                </div>

                <div>
                    <div class="customer-title">
                        Customer 360
                    </div>

                    <div class="customer-subtitle">
                        Complete customer context for this Case
                    </div>

                    <template lwc:if={hasBadges}>
                        <div class="customer-badges">
                            <template for:each={badges} for:item="badge">
                                <span
                                    key={badge.key}
                                    class={badge.cssClass}>
                                    {badge.label}
                                </span>
                            </template>
                        </div>
                    </template>
                </div>
            </div>

            <lightning-button-icon
                icon-name="utility:refresh"
                alternative-text="Refresh"
                title="Refresh"
                onclick={handleRefresh}>
            </lightning-button-icon>
        </div>


        <div class="slds-var-p-around_medium">

            <!-- LOADING -->
            <template lwc:if={isLoading}>
                <div class="loading-area">
                    <lightning-spinner
                        alternative-text="Loading Customer 360"
                        size="medium">
                    </lightning-spinner>
                </div>
            </template>


            <!-- ERROR -->
            <template lwc:elseif={error}>
                <div class="error-state">
                    {error}
                </div>
            </template>


            <!-- ACCOUNT FOUND -->
            <template lwc:elseif={hasAccount}>

                <!-- SUMMARY -->
                <div class="section-title">
                    Customer Overview
                </div>

                <div class="metrics-grid">

                    <div class="metric-card">
                        <span class="metric-label">
                            Lifetime Value
                        </span>

                        <span class="metric-value">
                            <lightning-formatted-number
                                value={lifetimeValue}
                                format-style="currency"
                                currency-code={preferredCurrency}>
                            </lightning-formatted-number>
                        </span>
                    </div>


                    <div class="metric-card">
                        <span class="metric-label">
                            Total Orders
                        </span>

                        <span class="metric-value">
                            {totalOrders}
                        </span>
                    </div>


                    <div class="metric-card">
                        <span class="metric-label">
                            Average Order Value
                        </span>

                        <span class="metric-value">
                            <lightning-formatted-number
                                value={averageOrderValue}
                                format-style="currency"
                                currency-code={preferredCurrency}>
                            </lightning-formatted-number>
                        </span>
                    </div>


                    <div class="metric-card">
                        <span class="metric-label">
                            Customer Since
                        </span>

                        <span class="metric-value-small">
                            <lightning-formatted-date-time
                                value={customerSince}
                                year="numeric"
                                month="short"
                                day="2-digit">
                            </lightning-formatted-date-time>
                        </span>
                    </div>

                </div>


                <!-- ACCOUNT -->
                <div class="information-grid information-grid-single">

                    <div class="info-card">

                        <div class="info-card-header">
                            <lightning-icon
                                icon-name="standard:account"
                                size="small">
                            </lightning-icon>

                            <span>Account Information</span>
                        </div>


                        <div class="field-row">
                            <span class="field-label">
                                Account Name
                            </span>

                            <lightning-button
                                variant="base"
                                label={accountName}
                                onclick={openAccount}>
                            </lightning-button>
                        </div>


                        <div class="field-row">
                            <span class="field-label">
                                Email
                            </span>

                            <lightning-formatted-email
                                value={personEmail}>
                            </lightning-formatted-email>
                        </div>


                        <div class="field-row">
                            <span class="field-label">
                                Phone
                            </span>

                            <span class="field-value">
                                {accountPhone}
                            </span>
                        </div>


                        <div class="field-row">
                            <span class="field-label">
                                Mobile
                            </span>

                            <span class="field-value">
                                {personMobile}
                            </span>
                        </div>


                        <template lwc:if={hasAccountAddress}>
                            <div class="field-row">
                                <span class="field-label">
                                    Address
                                </span>

                                <lightning-formatted-address
                                    street={accountStreet}
                                    city={accountCity}
                                    province={accountState}
                                    postal-code={accountPostalCode}
                                    country={accountCountry}>
                                </lightning-formatted-address>
                            </div>
                        </template>


                        <div class="field-row">
                            <span class="field-label">
                                Currency
                            </span>

                            <span class="field-value">
                                {preferredCurrency}
                            </span>
                        </div>


                        <div class="field-row">
                            <span class="field-label">
                                Type
                            </span>

                            <span class="field-value">
                                {accountType}
                            </span>
                        </div>


                        <div class="field-row">
                            <span class="field-label">
                                Customer Status
                            </span>

                            <span class="field-value">
                                {customerStatus}
                            </span>
                        </div>


                        <div class="field-row">
                            <span class="field-label">
                                Account Tier
                            </span>

                            <span class={accountTierClass}>
                                {accountTier}
                            </span>
                        </div>


                        <div class="field-row">
                            <span class="field-label">
                                Loyalty Tier Benefits
                            </span>

                            <span class="field-value">
                                {loyaltyTierBenefits}
                            </span>
                        </div>


                        <div class="field-row">
                            <span class="field-label">
                                KYC Status
                            </span>

                            <span class={kycBadgeClass}>
                                {kycStatusLabel}
                            </span>
                        </div>

                    </div>

                </div>


                <!-- ORDERS -->
                <div class="data-section">

                    <div class="section-header">
                        <span class="section-title">
                            Order History
                        </span>

                        <span class="count-badge">
                            {totalOrders} Orders
                        </span>
                    </div>


                    <template lwc:if={hasOrders}>
                        <div class="customer-table">
                            <lightning-datatable
                                key-field="Id"
                                data={orders}
                                columns={orderColumns}
                                hide-checkbox-column
                                onrowaction={handleOrderAction}>
                            </lightning-datatable>
                        </div>
                    </template>


                    <template lwc:else>
                        <div class="empty-state">
                            No orders found for this customer.
                        </div>
                    </template>

                </div>


                <!-- PREVIOUS CASES -->
                <div class="data-section">

                    <div class="section-header">
                        <span class="section-title">
                            Previous Cases
                        </span>

                        <span class="count-badge">
                            {totalCases} Total Cases
                        </span>
                    </div>


                    <template lwc:if={hasPreviousCases}>
                        <div class="customer-table">
                            <lightning-datatable
                                key-field="Id"
                                data={previousCases}
                                columns={caseColumns}
                                hide-checkbox-column
                                onrowaction={handleCaseAction}>
                            </lightning-datatable>
                        </div>
                    </template>


                    <template lwc:else>
                        <div class="empty-state">
                            No previous Cases found.
                        </div>
                    </template>

                </div>


                <!-- CONVERSATIONS -->
                <div class="data-section">

                    <div class="section-header">
                        <span class="section-title">
                            Previous Conversations
                        </span>

                        <span class="count-badge">
                            {conversationCount} Messages
                        </span>
                    </div>


                    <template lwc:if={hasConversations}>
                        <div class="customer-table">
                            <lightning-datatable
                                key-field="Id"
                                data={conversationRows}
                                columns={conversationColumns}
                                hide-checkbox-column
                                onrowaction={handleConversationAction}>
                            </lightning-datatable>
                        </div>
                    </template>


                    <template lwc:else>
                        <div class="empty-state">
                            No previous email conversations found.
                        </div>
                    </template>

                </div>

            </template>


            <!-- NO ACCOUNT -->
            <template lwc:else>
                <div class="warning-state">
                    No Account is linked to this Case.
                </div>
            </template>

        </div>
    </div>
</template>
